<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5733">
<title>Termofer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="application-name" content="Termofer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Termofer">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--o:#ff5733;--o2:#e23d12;--bg:#e5e7ec;--tx:#17202a;--mu:#7b8794;--ln:#dde1e7;--ok:#4cc38a;--bad:#e5484d;font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--o);color:var(--tx);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;font-size:16px;color:var(--tx);background:#fff;border:1px solid var(--ln);border-radius:12px;padding:13px 14px;width:100%}
.card{background:#fff;border-radius:22px;padding:16px 18px}
.btn{background:var(--o);color:#fff;font-weight:800;padding:15px;border-radius:30px;width:100%;letter-spacing:.03em}
.btn:disabled{opacity:.5}
.err{color:var(--bad);font-size:14px;min-height:1.2em}
.mu{color:var(--mu);font-size:14px}
/* giriş */
#login{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px;max-width:440px;margin:auto}
#login h1{color:#fff;font-size:34px;font-weight:800;text-align:center}
#loginForm{display:flex;flex-direction:column;gap:14px}
.field{display:flex;align-items:center;gap:10px}.field>*:first-child{flex:1;min-width:0}
.pw{position:relative}.pw input{padding-right:70px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:8px;font-size:13px;color:var(--mu)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);white-space:nowrap}
.chk input{width:20px;height:20px;padding:0;accent-color:var(--o)}
/* uygulama */
#app{max-width:440px;margin:auto;min-height:100%;display:flex;flex-direction:column}
#hd{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 14px;color:#fff;background:var(--o);position:sticky;top:0;z-index:2}
#hd b{font-size:19px;font-weight:800;letter-spacing:.04em}
#hd button{width:40px;height:40px;font-size:22px;color:#fff}
.view{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px}
.sub{background:var(--bg);min-height:calc(100vh - 56px)}
#home{background:var(--o)}
.hname{text-align:center;color:#fff;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.pills{display:flex;gap:10px;justify-content:center}
.pill{display:flex;align-items:center;gap:6px;border:1px solid #fff;border-radius:20px;padding:7px 14px;color:#fff;font-weight:600;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;background:#bbb}.on .dot,.dot.on{background:var(--ok)}.bad .dot{background:var(--bad)}
.gauge{position:relative;padding:8px 8px 20px;margin-top:6px}
.gauge svg{width:100%;display:block;touch-action:none;user-select:none}#knob{cursor:grab}
.gc{pointer-events:none;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:10px}
.gc .h{font-weight:800;font-size:22px}.gc .t{font-size:72px;font-weight:800;line-height:1}.stale .t{opacity:.4}
.gc .g{display:flex;align-items:center;gap:22px;color:#8a8f98;font-size:34px;font-weight:600;margin-top:4px}
.gc .g button{pointer-events:auto;font-size:34px;color:#8a8f98;padding:4px 10px}
.modes{display:flex;justify-content:space-around;background:#fff;border-radius:18px;padding:10px 4px}
.modes button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:800;color:#8a8f98;letter-spacing:.04em;padding:6px 10px}
.modes button span{font-size:26px}.modes .a{color:var(--o)}
.chips{display:flex;justify-content:space-around;background:#fff;border-radius:18px;padding:10px 4px}
.chips button{font-size:12px;font-weight:800;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;border-radius:12px}
.chips span{font-size:24px}.chips .a{color:var(--o);background:#fff1ed}
.menu button{display:flex;justify-content:space-between;width:100%;background:#fff;border-radius:16px;padding:18px;font-weight:800;letter-spacing:.03em;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;font-weight:600}
.row .st{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:600;color:#8a8f98}
.row .st button{font-size:28px;color:#8a8f98;padding:2px 10px}
.opt{display:flex;gap:12px;padding:10px 0;align-items:flex-start}.opt input{width:22px;height:22px;accent-color:var(--o);padding:0;margin-top:2px}
.tabs{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px}
.tabs button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--mu)}.tabs .a{background:#2f80ed;color:#fff}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .card b{font-size:34px;font-weight:800}.stat small{display:block;color:var(--mu)}
</style>
</head>
<body>
<section id="login">
  <h1>Termofer</h1>
  <form id="loginForm" class="card" novalidate>
    <div class="field"><input id="email" type="email" inputmode="email" placeholder="E-posta" autocomplete="username" autocapitalize="off" spellcheck="false"><label class="chk"><input type="checkbox" id="remEmail">Hatırla</label></div>
    <div class="field"><div class="pw"><input id="pass" type="password" placeholder="Şifre" autocomplete="current-password" autocapitalize="off" spellcheck="false"><button type="button" class="eye" id="eye">Göster</button></div><label class="chk"><input type="checkbox" id="remPass">Hatırla</label></div>
    <button type="submit" class="btn" id="loginBtn">Giriş yap</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</section>

<section id="app" hidden>
  <div id="hd"><button id="back" aria-label="Geri">←</button><b id="ttl">Termofer</b><span id="hdr"><button id="goRep" aria-label="Raporlar">▥</button><button id="goSet" aria-label="Ayarlar">⚙</button></span></div>

  <div class="view" id="home">
    <div class="hname" id="hname">Termofer</div>
    <div class="pills"><div class="pill" id="pOut">☀ <span id="out">--</span></div><div class="pill" id="pDev"><span class="dot"></span><span id="devTxt">Cihaz</span></div></div>
    <div class="card gauge" id="gauge">
      <svg viewBox="0 0 300 260"><path id="trk" fill="none" stroke="#eee" stroke-width="12" stroke-linecap="round"/><path id="prg" fill="none" stroke="#ff5733" stroke-width="12" stroke-linecap="round"/><circle id="tick" r="5" fill="#8a8f98"/><circle id="knob" r="15" fill="#e23d12" stroke="#fff" stroke-width="4"/></svg>
      <div class="gc"><div class="h" id="hum">--</div><div class="t" id="now">--</div><div class="g"><button id="minus" aria-label="Azalt">‹</button><span id="tgt">--</span><button id="plus" aria-label="Artır">›</button></div></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="modes" id="modes">
      <button data-m="program"><span>🗓</span>HAFTALIK PROGRAM</button>
      <button data-m="manual"><span>☝</span>MANUEL</button>
      <button data-m="off"><span>⏻</span>KAPALI</button>
    </div>
    <div class="err" id="toast" style="text-align:center;color:#fff"></div>
  </div>

  <div class="view sub menu" id="menu" hidden>
    <button data-go="temps">Sıcaklık Ayarları <i>›</i></button>
    <button data-go="prog">Haftalık Program Ayarları <i>›</i></button>
    <button data-go="homeset">Ev Ayarları <i>›</i></button>
    <button data-go="dev">Cihaz Bilgileri <i>›</i></button>
    <button id="logout" style="color:var(--bad)">Çıkış yap</button>
  </div>

  <div class="view sub" id="temps" hidden><div class="card"><p class="mu">Tüm modların hedef sıcaklıklarını buradan ayarlayabilirsiniz.</p><div id="tlist"></div></div><button class="btn" id="saveT">Kaydet</button></div>

  <div class="view sub" id="prog" hidden><div class="card"><p class="mu">Hazır programlardan birini seçin. Program, uygulama açıkken uygulanır.</p><div id="plist"></div></div><button class="btn" id="saveP">Kaydet</button></div>

  <div class="view sub" id="homeset" hidden><div class="card" style="display:flex;flex-direction:column;gap:12px"><b>Evin İsmi ve Yeri</b><input id="hn" placeholder="Ev adı"><input id="adr" placeholder="Şehir veya ilçe (ör. Kadıköy)"><button class="btn" id="srch" style="background:#2f80ed">Adresi ara</button><div id="res"></div><button class="btn" id="loc" style="background:#2f80ed">Konumumu kullan</button><div class="mu" id="locTxt">Konum seçilmedi</div></div><button class="btn" id="saveH">Kaydet</button></div>

  <div class="view sub" id="dev" hidden><div class="card" id="devInfo"></div></div>

  <div class="view sub" id="rep" hidden>
    <div class="card"><div class="tabs" id="rtabs"><button data-r="0" class="a">Günlük</button><button data-r="1">Haftalık</button><button data-r="2">Aylık</button></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><button id="rp" style="font-size:24px;color:#2f80ed;padding:0 12px">‹</button><b id="rl">Bugün</b><button id="rn" style="font-size:24px;color:#2f80ed;padding:0 12px">›</button></div></div>
    <div class="stat" id="rstat"></div>
    <div class="card"><b>Telemetri Verileri</b><div id="chart"></div><p class="mu" id="rnote"></p></div>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, update, set, get, query, orderByKey, startAt, endAt } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBQFYdIPW_HBE0qvQOP5MQNF-n27nK7Ozw",
  authDomain: "termostat-50c8f.firebaseapp.com",
  databaseURL: "https://termostat-50c8f-default-rtdb.firebaseio.com",
  projectId: "termostat-50c8f",
};
const TMIN = 10, TMAX = 30, STEP = 0.5, OFFLINE = 60;
const $ = id => document.getElementById(id);
const fmt = (n, d = 1) => Number(n).toLocaleString("tr-TR", { minimumFractionDigits: d, maximumFractionDigits: d });
const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getDatabase(app);
const MODES = { ev: ["🏠", "EV"], uyku: ["🌙", "UYKU"], disari: ["🚶", "DIŞARI"], kullanici: ["👤", "KULLANICI"] };
const PROGS = {
  tasarruf: ["Tasarruf Modu", "Hafta içi 0-7 Uyku, 7-18 Dışarı, 18-24 Ev. Haftasonu 0-9 Uyku, 9-24 Ev", { wd: [[0, "uyku"], [7, "disari"], [18, "ev"]], we: [[0, "uyku"], [9, "ev"]] }],
  is: ["İş Modu", "Hafta içi 0-7 Uyku, 7-9 Ev, 9-18 Dışarı, 18-24 Ev. Haftasonu 0-9 Uyku, 9-24 Ev", { wd: [[0, "uyku"], [7, "ev"], [9, "disari"], [18, "ev"]], we: [[0, "uyku"], [9, "ev"]] }],
  konfor: ["Konfor Modu", "Tüm günler 0-7 Uyku, 7-24 Ev", { wd: [[0, "uyku"], [7, "ev"]], we: [[0, "uyku"], [7, "ev"]] }],
};
const s = { target: 21, power: true, heating: false, temp: null, hum: null, lastSeen: 0 };
const cfg = { mode: "manual", preset: "ev", prog: "tasarruf", temps: { ev: 22, uyku: 20, disari: 18, kullanici: 21 }, home: {} };
let editUntil = 0, lastDb = {}, pend = null, ready = { t: false, c: false }, netOk = true, unsub = [], timer, outT = null, lastBucket = 0, view = "home";

/* ---------- Giriş ---------- */
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
$("remEmail").checked = store.get("rem_email_on") === "1";
$("remPass").checked = store.get("rem_pass_on") === "1";
if ($("remEmail").checked) $("email").value = store.get("rem_email") || "";
const AUTH_ERR = {
  "auth/invalid-credential": "E-posta veya şifre hatalı.", "auth/invalid-email": "E-posta adresi geçersiz.",
  "auth/user-not-found": "Bu e-posta ile kullanıcı yok.", "auth/wrong-password": "Şifre hatalı.",
  "auth/network-request-failed": "İnternet bağlantısı yok.", "auth/too-many-requests": "Çok fazla deneme. Biraz bekleyip tekrar dene.",
};
$("loginForm").addEventListener("submit", async e => {
  e.preventDefault(); $("loginErr").textContent = ""; $("loginBtn").disabled = true;
  try {
    await setPersistence(auth, $("remPass").checked ? browserLocalPersistence : browserSessionPersistence);
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value);
    store.set("rem_email_on", $("remEmail").checked ? "1" : null);
    store.set("rem_email", $("remEmail").checked ? $("email").value.trim() : null);
    store.set("rem_pass_on", $("remPass").checked ? "1" : null);
  } catch (err) { $("loginErr").textContent = AUTH_ERR[err.code] || ("Giriş yapılamadı: " + (err.code || err.message)); }
  $("loginBtn").disabled = false;
});
$("eye").onclick = () => { const p = $("pass"), h = p.type === "password"; p.type = h ? "text" : "password"; $("eye").textContent = h ? "Gizle" : "Göster"; };
$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  $("login").hidden = !!user; $("app").hidden = !user;
  unsub.forEach(f => f()); unsub = []; ready = { t: false, c: false };
  if (!user) return;
  go("home");
  unsub.push(onValue(ref(db, "thermostat"), snap => {
    const v = snap.val() || {};
    lastDb = { t: v.targetTemp, p: v.power };
    if (Date.now() > editUntil) {
      // Cihazdan (tuş) hedef değişti: program modunda isek manuele geç, program geri almasın
      if (ready.t && ready.c && cfg.mode === "program" && typeof v.targetTemp === "number" && v.targetTemp !== s.target) { cfg.mode = "manual"; saveCfg({ mode: "manual" }); }
      if (typeof v.targetTemp === "number") s.target = v.targetTemp;
      if (typeof v.power === "boolean") s.power = v.power;
    }
    s.heating = !!v.heating;
    s.temp = typeof v.currentTemp === "number" ? v.currentTemp : null;
    s.hum = typeof v.humidity === "number" ? v.humidity : null;
    s.lastSeen = v.lastSeen || 0;
    ready.t = true; reconcile(); logSample(); applyProgram(); render();
  }, e => toast("Veri okunamadı: " + e.code)));
  unsub.push(onValue(ref(db, "termofer"), snap => {
    const v = snap.val() || {};
    cfg.mode = v.mode || "manual"; cfg.preset = v.preset || "ev"; cfg.prog = v.prog || "tasarruf";
    cfg.temps = { ...cfg.temps, ...(v.temps || {}) }; cfg.home = v.home || {};
    ready.c = true; reconcile(); fetchOut(); applyProgram(); render();
  }));
  unsub.push(onValue(ref(db, ".info/connected"), c => { netOk = !!c.val(); render(); }));
});

/* ---------- Komut ---------- */
function push() {
  clearTimeout(timer);
  if (!pend) pend = { t: lastDb.t, p: lastDb.p, n: 0 };   // değişiklikten önceki değeri hatırla
  timer = setTimeout(send, 400);
}
function send() {
  const t = s.target, p = s.power;
  update(ref(db, "thermostat"), { targetTemp: t, power: p })
    .then(() => { toast(""); setTimeout(() => verify(t, p), 5000); })
    .catch(e => toast("Gönderilemedi: " + e.code));
}
// Cihaz eski değeri geri yazdıysa (yarış durumu) değişikliği en fazla 2 kez yeniden gönder
async function verify(t, p) {
  if (t !== s.target || p !== s.power) return;            // araya yeni değişiklik girmiş
  try {
    const v = (await get(ref(db, "thermostat"))).val() || {};
    if (v.targetTemp === t && v.power === p) { pend = null; return; }
    if (pend && v.targetTemp === pend.t && v.power === pend.p && pend.n < 2) { pend.n++; editUntil = Date.now() + 3000; send(); }
    else pend = null;                                     // başka biri (cihaz) değiştirmiş: dokunma
  } catch { pend = null; }
}
// Güç/mod tutarlılığı: cihazdan açma-kapama yapılınca uygulamadaki mod da uyar
function reconcile() {
  if (!(ready.t && ready.c) || Date.now() <= editUntil) return;
  if (!s.power && cfg.mode !== "off") { cfg.mode = "off"; saveCfg({ mode: "off" }); }
  else if (s.power && cfg.mode === "off") { cfg.mode = "manual"; saveCfg({ mode: "manual" }); }
}
const saveCfg = o => update(ref(db, "termofer"), o).catch(e => toast("Kaydedilemedi: " + e.code));
function setTarget(v, userEdit = true) {
  v = Math.min(TMAX, Math.max(TMIN, Math.round(v / STEP) * STEP));
  if (v === s.target) return;
  if (cfg.mode === "program" && userEdit) { cfg.mode = "manual"; saveCfg({ mode: "manual" }); }
  s.target = v; editUntil = Date.now() + 3000; render(); push();
}
$("minus").onclick = () => setTarget(s.target - STEP);
$("plus").onclick = () => setTarget(s.target + STEP);
const svg = $("gauge").querySelector("svg"); let drag = false;
function fromPointer(e) {
  const r = svg.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width * 300 - CX, y = (e.clientY - r.top) / r.height * 260 - CY;
  let rel = ((Math.atan2(y, x) * 180 / Math.PI) - A0 + 360) % 360;
  if (rel > SW) rel = rel > SW + (360 - SW) / 2 ? 0 : SW;
  setTarget(TMIN + rel / SW * (TMAX - TMIN));
}
svg.addEventListener("pointerdown", e => { drag = true; svg.setPointerCapture(e.pointerId); fromPointer(e); });
svg.addEventListener("pointermove", e => drag && fromPointer(e));
svg.addEventListener("pointerup", () => drag = false);
svg.addEventListener("pointercancel", () => drag = false);
$("modes").onclick = e => {
  const m = e.target.closest("button")?.dataset.m; if (!m) return;
  cfg.mode = m; s.power = m !== "off"; editUntil = Date.now() + 3000;
  if (m === "program") applyProgram(true);
  saveCfg({ mode: m }); render(); push();
};
$("chips").onclick = e => {
  const k = e.target.closest("button")?.dataset.k; if (!k || cfg.mode !== "manual") return;
  cfg.preset = k; saveCfg({ preset: k }); setTarget(cfg.temps[k]); render();
};

/* ---------- Haftalık program (uygulama açıkken uygulanır) ---------- */
function progMode(d = new Date()) {
  const segs = PROGS[cfg.prog]?.[2][d.getDay() % 6 === 0 ? "we" : "wd"] || [];
  const h = d.getHours() + d.getMinutes() / 60; let m = segs[0]?.[1] || "ev";
  segs.forEach(([f, k]) => { if (f <= h) m = k; });
  return m;
}
function applyProgram(force) {
  if (cfg.mode !== "program" || !s.power) return;
  const t = cfg.temps[progMode()];
  if (t != null && t !== s.target && (force || Date.now() > editUntil)) { s.target = t; editUntil = Date.now() + 3000; push(); }
}
setInterval(() => { applyProgram(); render(); }, 30000);

/* ---------- Dış sıcaklık ---------- */
async function fetchOut() {
  const { lat, lon } = cfg.home; if (lat == null) { outT = null; return; }
  try {
    const r = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`)).json();
    outT = r.current?.temperature_2m ?? null; render();
  } catch {}
}
setInterval(fetchOut, 15 * 60000);

/* ---------- Kayıt (uygulama açıkken 10 dk'da bir) ---------- */
const key = b => String(b).padStart(8, "0");
function logSample() {
  const b = Math.floor(Date.now() / 600000);
  if (b === lastBucket || s.temp == null || !online()) return;
  lastBucket = b;
  set(ref(db, "termofer/history/" + key(b)), { t: s.temp, h: s.hum ?? null, g: s.target, o: s.heating && s.power ? 1 : 0 }).catch(() => {});
}

/* ---------- Çizim ---------- */
const online = () => netOk && s.lastSeen && (Date.now() / 1000 - s.lastSeen) < OFFLINE;
const CX = 150, CY = 140, R = 118, A0 = 145, SW = 250;
const ang = v => A0 + (Math.min(TMAX, Math.max(TMIN, v)) - TMIN) / (TMAX - TMIN) * SW;
const pt = a => [CX + R * Math.cos(a * Math.PI / 180), CY + R * Math.sin(a * Math.PI / 180)];
const arc = (a, b) => { const [x1, y1] = pt(a), [x2, y2] = pt(b); return `M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 ${b - a > 180 ? 1 : 0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`; };
$("trk").setAttribute("d", arc(A0, A0 + SW));
function render() {
  const on = online();
  $("hname").textContent = cfg.home.name || "Termofer";
  $("pDev").className = "pill " + (on ? "on" : "bad");
  $("devTxt").textContent = !netOk ? "Çevrimdışı" : on ? "Cihaz" : "Cihaz yok";
  $("out").textContent = outT == null ? "--" : fmt(outT) + "°";
  $("gauge").classList.toggle("stale", !on);
  const a = ang(s.target), [kx, ky] = pt(a);
  $("prg").setAttribute("d", arc(A0, Math.max(A0 + .01, a)));
  $("knob").setAttribute("cx", kx); $("knob").setAttribute("cy", ky);
  const tk = $("tick"); if (s.temp == null) tk.setAttribute("r", 0); else { const [tx, ty] = pt(ang(s.temp)); tk.setAttribute("r", 5); tk.setAttribute("cx", tx); tk.setAttribute("cy", ty); }
  $("now").textContent = s.temp == null ? "--" : fmt(s.temp) + "°";
  $("hum").textContent = s.hum == null ? "" : "%" + fmt(s.hum, 0);
  $("tgt").textContent = s.power ? fmt(s.target) + "°" : "Kapalı";
  $("modes").querySelectorAll("button").forEach(b => b.classList.toggle("a", (!s.power ? "off" : cfg.mode === "off" ? "manual" : cfg.mode) === b.dataset.m));
  const cur = cfg.mode === "program" ? progMode() : cfg.preset;
  $("chips").innerHTML = s.power ? Object.entries(MODES).map(([k, [i, n]]) => `<button data-k="${k}" class="${k === cur ? "a" : ""}"><span>${i}</span>${n}</button>`).join("") : "";
  $("chips").hidden = !s.power;
  if (view === "dev") devInfo();
}
const toast = t => $("toast").textContent = t;

/* ---------- Sayfalar ---------- */
const TITLES = { home: "Termofer", menu: "Ayarlar", temps: "Sıcaklık Ayarları", prog: "Haftalık Program Ayarları", homeset: "Ev Ayarları", dev: "Cihaz Bilgileri", rep: "Raporlar" };
const PARENT = { menu: "home", rep: "home" };
function go(v) {
  view = v;
  Object.keys(TITLES).forEach(k => $(k).hidden = k !== v);
  $("ttl").textContent = TITLES[v]; $("back").style.visibility = v === "home" ? "hidden" : "visible";
  $("hdr").style.visibility = v === "home" ? "visible" : "hidden";
  if (v === "temps") tempsView(); if (v === "prog") progView(); if (v === "homeset") homeView(); if (v === "dev") devInfo(); if (v === "rep") report();
  scrollTo(0, 0); render();
}
$("back").onclick = () => go(PARENT[view] || "menu");
$("goSet").onclick = () => go("menu"); $("goRep").onclick = () => go("rep");
$("menu").onclick = e => { const g = e.target.closest("[data-go]")?.dataset.go; if (g) go(g); };
$("pDev").onclick = () => go("dev");

let tmp = {};
function tempsView() {
  tmp = { ...cfg.temps };
  const draw = () => $("tlist").innerHTML = Object.entries(MODES).map(([k, [i, n]]) => `<div class="row"><span>${i} ${n}</span><span class="st"><button data-k="${k}" data-d="-1">‹</button>${fmt(tmp[k])}°<button data-k="${k}" data-d="1">›</button></span></div>`).join("");
  draw();
  $("tlist").onclick = e => { const b = e.target.closest("button"); if (!b) return; tmp[b.dataset.k] = Math.min(TMAX, Math.max(TMIN, tmp[b.dataset.k] + b.dataset.d * STEP)); draw(); };
}
$("saveT").onclick = () => { cfg.temps = { ...tmp }; saveCfg({ temps: tmp }); applyProgram(true); go("menu"); };

let pSel = "tasarruf";
function progView() {
  pSel = cfg.prog;
  $("plist").innerHTML = Object.entries(PROGS).map(([k, [n, d]]) => `<label class="opt"><input type="radio" name="p" value="${k}" ${k === pSel ? "checked" : ""}><span><b>${n}</b><br><span class="mu">${d}</span></span></label>`).join("");
  $("plist").onchange = e => pSel = e.target.value;
}
$("saveP").onclick = () => { cfg.prog = pSel; saveCfg({ prog: pSel }); applyProgram(true); go("menu"); };

let hPos = {};
function homeView() { hPos = { lat: cfg.home.lat, lon: cfg.home.lon, place: cfg.home.place }; $("res").innerHTML = ""; $("adr").value = ""; $("hn").value = cfg.home.name || ""; locTxt(); }
const locTxt = () => $("locTxt").textContent = hPos.lat == null ? "Konum seçilmedi" : `Konum: ${hPos.place || hPos.lat.toFixed(3) + ", " + hPos.lon.toFixed(3)}`;
$("loc").onclick = () => navigator.geolocation?.getCurrentPosition(p => { hPos = { lat: p.coords.latitude, lon: p.coords.longitude, place: "" }; locTxt(); }, () => $("locTxt").textContent = "Konum alınamadı. Tarayıcıda konum iznini aç.");
let found = [];
$("srch").onclick = async () => {
  const q = $("adr").value.split(",")[0].trim(); if (!q) return;
  $("res").innerHTML = '<p class="mu">Aranıyor…</p>';
  try {
    const r = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=tr&format=json`)).json();
    found = r.results || [];
    $("res").innerHTML = found.length ? found.map((f, i) => `<button class="btn" data-i="${i}" style="background:#fff;color:var(--tx);border:1px solid var(--ln);margin-top:8px;text-align:left;font-weight:600">${[f.name, f.admin2, f.admin1, f.country].filter(Boolean).join(", ")}</button>`).join("") : '<p class="mu">Sonuç yok. Sadece şehir veya ilçe adı dene.</p>';
  } catch { $("res").innerHTML = '<p class="mu">Arama yapılamadı. İnterneti kontrol et.</p>'; }
};
$("res").onclick = e => {
  const f = found[e.target.closest("button")?.dataset.i]; if (!f) return;
  hPos = { lat: f.latitude, lon: f.longitude, place: [f.name, f.admin1].filter(Boolean).join(", ") };
  if (!$("hn").value.trim()) $("hn").value = f.name;
  $("res").innerHTML = ""; locTxt();
};
$("saveH").onclick = () => { const h = { name: $("hn").value.trim(), lat: hPos.lat ?? null, lon: hPos.lon ?? null, place: hPos.place || "" }; cfg.home = h; saveCfg({ home: h }); fetchOut(); go("menu"); };

function devInfo() {
  const on = online(), age = s.lastSeen ? Math.max(0, Math.round(Date.now() / 1000 - s.lastSeen)) : null;
  const rows = [["Bağlantı durumu", on ? "🟢 Çevrimiçi" : "🔴 Çevrimdışı"], ["Son veri", age == null ? "--" : age < 90 ? age + " sn önce" : Math.round(age / 60) + " dk önce"], ["İç sıcaklık", s.temp == null ? "--" : fmt(s.temp) + " °C"], ["Nem", s.hum == null ? "--" : "%" + fmt(s.hum, 0)], ["Isıtma", s.heating ? "Çalışıyor" : "Bekliyor"]];
  $("devInfo").innerHTML = rows.map(([a, b]) => `<div class="row"><span>${a}</span><b>${b}</b></div>`).join("");
}

/* ---------- Raporlar ---------- */
let rr = 0, ro = 0;
$("rtabs").onclick = e => { const r = e.target.closest("button")?.dataset.r; if (r == null) return; rr = +r; ro = 0; report(); };
$("rp").onclick = () => { ro++; report(); }; $("rn").onclick = () => { if (ro) { ro--; report(); } };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
async function report() {
  $("rtabs").querySelectorAll("button").forEach(b => b.classList.toggle("a", +b.dataset.r === rr));
  const days = [1, 7, 30][rr], span = days * 864e5, end = Date.now() - ro * span, from = end - span;
  $("rl").textContent = (ro ? ro + " dönem önce · " : "") + ["Son 24 saat", "Son 7 gün", "Son 30 gün"][rr];
  let rows = [], outs = [];
  try {
    const sn = await get(query(ref(db, "termofer/history"), orderByKey(), startAt(key(from / 600000 | 0)), endAt(key(end / 600000 | 0))));
    sn.forEach(c => { rows.push({ ts: +c.key * 600000, ...c.val() }); });
  } catch (e) { $("rnote").textContent = "Kayıtlar okunamadı: " + e.code; }
  const { lat, lon } = cfg.home;
  if (lat != null) try {
    const r = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&hourly=temperature_2m&past_days=31&forecast_days=1&timezone=GMT`)).json();
    r.hourly.time.forEach((t, i) => { const ts = Date.parse(t + "Z"); if (ts >= from && ts <= end && r.hourly.temperature_2m[i] != null) outs.push({ ts, v: r.hourly.temperature_2m[i] }); });
  } catch {}
  const T = rows.map(r => r.t).filter(v => v != null), H = rows.map(r => r.h).filter(v => v != null), O = outs.map(o => o.v);
  const card = (ic, n, a, u, arr) => `<div class="card"><span class="mu">${ic} ${n}</span><br><b>${a == null ? "--" : fmt(a)}</b> ${u}<small>Y:${arr.length ? fmt(Math.max(...arr)) : "--"} &nbsp; D:${arr.length ? fmt(Math.min(...arr)) : "--"}</small></div>`;
  const mins = rows.filter(r => r.o === 1).length * 10, hasO = rows.some(r => r.o != null);
  const kombi = `<div class="card"><span class="mu">🔥 Kombi Çalışma</span><br><b>${!hasO ? "--" : mins >= 60 ? Math.floor(mins / 60) + " sa " + (mins % 60) + " dk" : mins + " dk"}</b><small>Kayıtlı verilere göre</small></div>`;
  $("rstat").innerHTML = card("🏠", "İç Mekan", avg(T), "°C", T) + card("☀", "Dış Ortam", avg(O), "°C", O) + card("💧", "Nem", avg(H), "%", H) + kombi;
  $("chart").innerHTML = chart(rows, outs, from, end);
  $("rnote").textContent = lat == null ? "Dış sıcaklık için Ev Ayarları'ndan konumu seç. " : "";
  $("rnote").textContent += "Kayıtlar uygulama açıkken 10 dakikada bir alınır.";
}
function chart(rows, outs, from, end) {
  const W = 320, H = 170, p = 28, a = rows.map(r => r.t), b = outs.map(o => o.v), all = [...a, ...b, ...rows.map(r => r.g).filter(v => v != null)];
  if (all.length < 2) return `<p class="mu" style="padding:30px 0;text-align:center">Bu aralıkta veri yok.</p>`;
  const lo = Math.floor(Math.min(...all) - 1), hi = Math.ceil(Math.max(...all) + 1);
  const X = t => p + (t - from) / (end - from) * (W - p - 6), Y = v => H - 18 - (v - lo) / (hi - lo) * (H - 28);
  const line = (arr, col) => arr.length > 1 ? `<polyline fill="none" stroke="${col}" stroke-width="2" points="${arr.map(([t, v]) => X(t).toFixed(1) + "," + Y(v).toFixed(1)).join(" ")}"/>` : "";
  const fm = t => new Date(t).toLocaleString("tr-TR", end - from > 864e5 ? { day: "2-digit", month: "2-digit" } : { hour: "2-digit", minute: "2-digit" });
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%"><text x="2" y="${Y(hi) + 8}" font-size="10" fill="#888">${hi}°</text><text x="2" y="${Y(lo)}" font-size="10" fill="#888">${lo}°</text><line x1="${p}" x2="${p}" y1="8" y2="${H - 18}" stroke="#bbb"/><line x1="${p}" x2="${W - 6}" y1="${H - 18}" y2="${H - 18}" stroke="#bbb"/>${line(rows.filter(r => r.g != null).map(r => [r.ts, r.g]), "#555").replace("<polyline", '<polyline stroke-dasharray="6 5"')}${line(outs.map(o => [o.ts, o.v]), "#f2994a")}${line(rows.map(r => [r.ts, r.t]), "#e5484d")}<text x="${p}" y="${H - 4}" font-size="10" fill="#888">${fm(from)}</text><text x="${W - 6}" y="${H - 4}" font-size="10" fill="#888" text-anchor="end">${fm(end)}</text></svg><p class="mu"><span style="color:#e5484d">■</span> İç &nbsp; <span style="color:#f2994a">■</span> Dış &nbsp; <span style="color:#555">╌</span> Hedef</p>`;
}

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
